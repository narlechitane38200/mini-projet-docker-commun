services:

  registry-private:
    image: registry:2
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

  registry-ui:
    image: joxit/docker-registry-ui:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      - REGISTRY_TITLE=Mon Docker Registry
      - REGISTRY_URL=http://registry:5000
      - SINGLE_REGISTRY=true
    depends_on:
      - registry

volumes:
  registry_data:
